<div
  class="mx-auto max-w-lg rounded-3xl border border-dashed border-line bg-cream/50 px-6 py-12 text-center"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
>
  <p class="font-display text-2xl font-semibold text-brand">{{ title() }}</p>
  @if (message()) {
    <p class="mt-3 text-ink-soft">{{ message() }}</p>
  }
  @if (kind() === 'error') {
    <button type="button" class="btn-outline mt-6" (click)="retry.emit()">Tentar novamente</button>
  }
  <ng-content />
</div>
