@let p = product();
<article
  class="group relative flex h-full flex-col overflow-hidden rounded-3xl border border-line/80 bg-white transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-brand/10"
>
  <div class="relative aspect-[4/3] overflow-hidden bg-cream">
    @if (p.mainImage; as image) {
      <img
        [ngSrc]="image.url"
        fill
        [priority]="priority()"
        [alt]="image.alt || p.name"
        class="object-cover transition duration-700 group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-ink-soft">Sem imagem</div>
    }
    <div class="absolute top-3 left-3 flex flex-wrap gap-2">
      @if (p.featured) {
        <span class="rounded-full bg-accent px-3 py-1 text-[0.7rem] font-semibold text-ink"
          >Destaque</span
        >
      }
      @if (p.availability !== 'IN_STOCK') {
        <span
          class="rounded-full bg-white/90 px-3 py-1 text-[0.7rem] font-semibold text-ink-soft"
          >{{ availability() }}</span
        >
      }
    </div>
  </div>

  <div class="flex flex-1 flex-col p-6">
    <p class="eyebrow">{{ p.category.name }}</p>
    <h3 class="mt-2 text-xl font-semibold text-ink">
      <a [routerLink]="['/produtos', p.slug]" class="after:absolute after:inset-0">{{ p.name }}</a>
    </h3>
    <p class="mt-2 line-clamp-2 text-sm leading-relaxed text-ink-soft">{{ p.shortDescription }}</p>
    <div class="mt-auto flex items-end justify-between gap-3 pt-5">
      <p class="font-display text-lg font-semibold text-brand">{{ price() ?? 'Sob consulta' }}</p>
      <span
        aria-hidden="true"
        class="shrink-0 text-sm font-semibold whitespace-nowrap text-accent-deep transition group-hover:translate-x-1"
      >
        Ver detalhes →
      </span>
    </div>
  </div>
</article>
